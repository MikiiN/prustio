[package]
name = "prustio"
version = "1.0.3"
edition = "2024"
authors = ["Michal Žatečka"]
description = "The Rust embedded project management."
license = "Apache-2.0"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
comfy-table = "7.2.2"
dirs = "6.0.0"
regex = "1.12.3"
serde = { version = "1.0", features = ["derive"] }
serde_ini = "0.2"
serde_json = "1.0"
toml = "1.0.7"
toml_edit = {version="0.23.9", features = ["serde"]}

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
